<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Spesial Kita</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fdf6f0;
            color: #5d4037;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        #music-control {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 14px;
        }

        .header {
            padding: 90px 20px 60px 20px;
            background-image: linear-gradient(to bottom, rgba(253,246,240,0.85), #fdf6f0), 
                              url('foto-utama.JPG');
            background-size: cover;
            background-position: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #8d6e63;
        }

        .memory-section {
            padding: 40px 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .map-section {
            padding: 40px 20px 70px 20px;
            background-color: #ffffff;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #8d6e63;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            margin-top: 20px;
            font-size: 16px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div id="music-control" onclick="toggleMusic()">
        🎵 <span id="music-status">Play Musik</span>
    </div>
    <audio id="myAudio" loop>
        <source src="https://ia801503.us.archive.org/15/items/taylor-swift-love-story/Taylor%20Swift%20-%20Love%20Story.mp3" type="audio/mpeg">
    </audio>

    <div class="header">
        <h1>Perayaan Spesial Kami</h1>
        <p><i>"You'll be the prince and I'll be the princess..."</i></p>
        <h2>Alex & Sarah</h2>
        <p>Sabtu, 12 Oktober 2024</p>
    </div>

    <div class="memory-section">
        <h3>Our Story in Pictures</h3>
        <div class="gallery">
            <img src="foto1.JPG" alt="Kenangan 1">
            <img src="foto2.JPG" alt="Kenangan 2">
            <img src="foto3.JPG" alt="Kenangan 3">
            <img src="foto4.JPG" alt="Kenangan 4">
            <img src="foto5.JPG" alt="Kenangan 5">
            <img src="foto6.JPG" alt="Kenangan 6">
        </div>
    </div>

    <div class="map-section">
        <h3>Lokasi Acara</h3>
        <p>Klik tombol di bawah untuk melihat rute via Google Maps:</p>
        <a href="https://maps.app.goo.gl/eHSD31kX3jjSyUaQ7" target="_blank" class="btn">📍 Buka Lokasi di Google Maps</a>
    </div>

    <script>
        var audio = document.getElementById("myAudio");
        var statusSpan = document.getElementById("music-status");

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                statusSpan.innerText = "Pause";
            } else {
                audio.pause();
                statusSpan.innerText = "Play Musik";
            }
        }

        // Musik otomatis play saat layar disentuh/diklik pertama kali
        document.body.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                statusSpan.innerText = "Pause";
            }
        }, { once: true });
    </script>

</body>
</html>
